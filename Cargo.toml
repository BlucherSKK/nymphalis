[package]
name = "nymphalis"
version = "0.4.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query", "form", "socks", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
indicatif = "0.17"
env_logger = "0.11.11"
percent-encoding = "2"
regex = "1.12.4"
base64 = "0.22.1"
