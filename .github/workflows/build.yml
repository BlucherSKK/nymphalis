name: Build

on:
  push:
    branches: ['main']

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag:            ${{ steps.cb.outputs.tag }}
      is_release:     ${{ steps.cb.outputs.is_release }}
      release_stable: ${{ steps.cb.outputs.release_stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cb
        uses: BlucherSKK/commit-builder@main
        continue-on-error: true
        with:
          separator: '###'

  build:
    needs: [meta]
    if: needs.meta.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nymphalis-linux-amd64
            bin: nymphalis
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: nymphalis-linux-amd64-musl
            apt: musl-tools
            bin: nymphalis
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nymphalis-macos-arm64
            bin: nymphalis
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nymphalis-windows-amd64.exe
            bin: nymphalis.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: matrix.apt != ''
        run: sudo apt-get install -y ${{ matrix.apt }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists, skipping"
          fi

      - name: Download artifacts
        if: needs.meta.outputs.is_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare binaries
        if: needs.meta.outputs.is_release == 'true'
        run: |
          mkdir out
          mv dist/nymphalis-linux-amd64/nymphalis           out/nymphalis-linux-amd64
          mv dist/nymphalis-linux-amd64-musl/nymphalis      out/nymphalis-linux-amd64-musl
          mv dist/nymphalis-macos-arm64/nymphalis           out/nymphalis-macos-arm64
          mv dist/nymphalis-windows-amd64.exe/nymphalis.exe out/nymphalis-windows-amd64.exe

      - name: Read release notes
        if: needs.meta.outputs.is_release == 'true'
        id: notes
        run: |
          echo "title=$(head -1 RELEASE.md | sed 's/^#* *//')" >> "$GITHUB_OUTPUT"
          tail -n +2 RELEASE.md > release_body.md

      - name: Create release
        if: needs.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: release_body.md
          prerelease: ${{ needs.meta.outputs.release_stable != 'true' }}
          files: |
            out/nymphalis-linux-amd64
            out/nymphalis-linux-amd64-musl
            out/nymphalis-macos-arm64
            out/nymphalis-windows-amd64.exe
